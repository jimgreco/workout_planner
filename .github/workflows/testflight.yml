name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'V6JPQCD336' }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.workoutplanner.ios' }}
      IOS_LIVE_ACTIVITY_BUNDLE_ID: ${{ vars.IOS_LIVE_ACTIVITY_BUNDLE_ID || 'com.workoutplanner.ios.LiveActivity' }}
      IOS_APP_GROUP_ID: ${{ vars.IOS_APP_GROUP_ID || 'group.com.workoutplanner.ios' }}
      IOS_SCHEME: ${{ vars.IOS_SCHEME || 'WorkoutPlanner' }}
      XCODE_PROJECT: ios/WorkoutPlanner.xcodeproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          for path in /Applications/Xcode_26.2.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_26.app /Applications/Xcode.app; do
            if [ -d "$path" ]; then
              sudo xcode-select -s "$path/Contents/Developer"
              echo "Selected $path"
              break
            fi
          done
          xcodebuild -version

      - name: Configure iOS app
        env:
          IOS_API_BASE_URL: ${{ secrets.IOS_API_BASE_URL }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_IOS_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
          GIT_COMMIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$IOS_API_BASE_URL"
          test -n "$GOOGLE_IOS_CLIENT_ID"
          test -n "$GOOGLE_IOS_REVERSED_CLIENT_ID"
          if [[ "$IOS_API_BASE_URL" == *YOUR_API_ID* || "$GOOGLE_IOS_CLIENT_ID" == *YOUR_IOS_CLIENT_ID* ]]; then
            echo "iOS release configuration still contains placeholder values."
            exit 1
          fi

          PLIST="ios/WorkoutPlanner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :API_BASE_URL $IOS_API_BASE_URL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :GOOGLE_IOS_CLIENT_ID $GOOGLE_IOS_CLIENT_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :GIT_COMMIT_HASH ${GIT_COMMIT_HASH:0:7}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $GOOGLE_IOS_REVERSED_CLIENT_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Set up App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_PRIVATE_KEY"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$API_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Import signing assets
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KC_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CERT_P12"
          test -n "$KC_PWD"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security create-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          printf '%s' "$CERT_P12" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/distribution.p12" -noout -passin pass:"$CERT_PWD"; then
            echo "Certificate import preflight failed; check IOS_DIST_CERT_P12 and IOS_DIST_CERT_PASSWORD."
            exit 1
          fi
          openssl pkcs12 -in "$RUNNER_TEMP/distribution.p12" -clcerts -nokeys -passin pass:"$CERT_PWD" -out "$RUNNER_TEMP/distribution-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/distribution-cert.pem" -outform DER -out "$RUNNER_TEMP/distribution-cert.der"

          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PWD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PWD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          node .github/scripts/ensure-app-store-profile.mjs \
            --bundle-id "$IOS_BUNDLE_ID" \
            --profile-name "Forge App Store ${GITHUB_RUN_ID}" \
            --certificate-der "$RUNNER_TEMP/distribution-cert.der" \
            --output "$RUNNER_TEMP/profile.mobileprovision"

          validate_profile() {
            local profile_path="$1"
            local expected_app_id="$2"
            local label="$3"
            local plist_path="$RUNNER_TEMP/$label.plist"

            security cms -D -i "$profile_path" > "$plist_path"

            local profile_app_id
            profile_app_id="$(plutil -extract Entitlements.application-identifier raw -o - "$plist_path")"
            if [ "$profile_app_id" != "$expected_app_id" ]; then
              echo "$label provisioning profile App ID '$profile_app_id' does not match '$expected_app_id'."
              exit 1
            fi

            if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" "$plist_path" 2>/dev/null | grep -Fq "$IOS_APP_GROUP_ID"; then
              echo "$label provisioning profile does not include App Group '$IOS_APP_GROUP_ID'."
              echo "Enable App Groups on the '$expected_app_id' App ID, assign '$IOS_APP_GROUP_ID', then rerun this workflow."
              exit 1
            fi
          }

          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          PROFILE_NAME="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -o - -)"
          EXPECTED_APP_ID="$APPLE_TEAM_ID.$IOS_BUNDLE_ID"
          validate_profile "$RUNNER_TEMP/profile.mobileprovision" "$EXPECTED_APP_ID" "App"

          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          node .github/scripts/ensure-app-store-profile.mjs \
            --bundle-id "$IOS_LIVE_ACTIVITY_BUNDLE_ID" \
            --profile-name "Forge Live Activity App Store ${GITHUB_RUN_ID}" \
            --certificate-der "$RUNNER_TEMP/distribution-cert.der" \
            --output "$RUNNER_TEMP/live-activity-profile.mobileprovision"

          LIVE_ACTIVITY_PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/live-activity-profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          LIVE_ACTIVITY_PROFILE_NAME="$(security cms -D -i "$RUNNER_TEMP/live-activity-profile.mobileprovision" | plutil -extract Name raw -o - -)"
          EXPECTED_LIVE_ACTIVITY_APP_ID="$APPLE_TEAM_ID.$IOS_LIVE_ACTIVITY_BUNDLE_ID"
          validate_profile "$RUNNER_TEMP/live-activity-profile.mobileprovision" "$EXPECTED_LIVE_ACTIVITY_APP_ID" "Live Activity"

          cp "$RUNNER_TEMP/live-activity-profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$LIVE_ACTIVITY_PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_LIVE_ACTIVITY_PROFILE_NAME=$LIVE_ACTIVITY_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Compute build number
        run: |
          set -euo pipefail
          BUILD_NUMBER="$(git rev-list HEAD --count)"
          if [ "$BUILD_NUMBER" -lt 1 ]; then
            echo "Computed build number '$BUILD_NUMBER' from git commit count is invalid."
            exit 1
          fi
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"

      - name: Archive
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WorkoutPlanner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Export IPA
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Clear dict" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROFILE_NAME" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_LIVE_ACTIVITY_BUNDLE_ID string $IOS_LIVE_ACTIVITY_PROFILE_NAME" "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WorkoutPlanner.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          UPLOAD_LOG="$RUNNER_TEMP/altool-upload.log"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" 2>&1 | tee "$UPLOAD_LOG"

          if grep -Eq "UPLOAD FAILED|Validation failed|Failed to upload package" "$UPLOAD_LOG"; then
            exit 1
          fi

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
