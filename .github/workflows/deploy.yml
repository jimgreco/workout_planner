name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this main commit (pushes to main deploy automatically)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: repmixburn-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Test web app
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Audit web production dependencies
        run: npm audit --omit=dev

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev

      - name: Verify private files are excluded from production images
        run: |
          set -euo pipefail
          mkdir -p output/ci
          python3 scripts/test-docker-context-fixtures.py
          bash scripts/check-docker-context.sh workouts 2>&1 | tee output/ci/docker-context.log

      - name: Upload Docker context diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-context-diagnostics
          path: output/ci/docker-context.log
          if-no-files-found: warn
          retention-days: 14

      - name: Check release hardening config
        run: |
          set -euo pipefail
          grep -q 'FROM node:22' Dockerfile
          # server.json pins APP_VERSION literally (release metadata cannot read
          # package.json); it must match the version this commit declares.
          python3 - <<'PY'
          import json
          manifest = json.load(open('.github/release/server.json'))
          version = json.load(open('package.json'))['version']
          images = {image['tag_suffix']: image for image in manifest['images']}
          found = {
              'services.workout_api.metadata_env.APP_VERSION': manifest['services']['workout_api']['metadata_env']['APP_VERSION'],
              'images[api].build_args.APP_VERSION': images['api']['build_args']['APP_VERSION'],
              'images[web].build_args.VITE_APP_VERSION': images['web']['build_args']['VITE_APP_VERSION'],
          }
          wrong = [key for key, value in found.items() if value != version]
          if wrong:
              raise SystemExit('::error::server.json ' + ', '.join(wrong) + ' must equal package.json version ' + version)
          print('server.json release version matches package.json:', version)
          PY

  release:
    # Every verified push to main releases; a manual dispatch on main can re-release.
    # The shared release-tools workflow builds exact-commit ARM64 api/web images,
    # pushes them to GHCR and replaces only workout_api/workout on the host
    # (drift-checked, health-checked, rolled back on failure).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_production)
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: jimgreco/release-tools/.github/workflows/server-release.yml@ff61f1c6a6eb51ea982246473203bcc903ce8153
    with:
      tools_ref: ff61f1c6a6eb51ea982246473203bcc903ce8153
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}

  smoke:
    name: Smoke test live app
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://repmixburn.com' }}
    steps:
      - name: Smoke test public endpoints
        run: |
          set -euo pipefail
          smoke_curl() {
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-max-time 120 \
              --retry-connrefused --connect-timeout 5 --max-time 10 "$1"
          }
          smoke_curl "$WEB_BASE_URL/api/healthz"
          smoke_curl "$WEB_BASE_URL/api/version"
          smoke_curl "$WEB_BASE_URL" >/dev/null
