name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Test web app
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Audit web production dependencies
        run: npm audit --omit=dev

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev

      - name: Check release hardening config
        run: |
          set -euo pipefail
          grep -q 'FROM node:22' Dockerfile
          grep -q 'StrictHostKeyChecking=yes' .github/workflows/deploy.yml

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://workout-planner.jim-greco.com' }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://workout-planner.jim-greco.com' }}
      APP_VERSION: ${{ vars.APP_VERSION || '1.0.0' }}
      APP_SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
      APPLE_CLIENT_IDS: ${{ secrets.APPLE_CLIENT_IDS || vars.IOS_BUNDLE_ID || 'com.workoutplanner.ios' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check production secrets
        run: |
          set -euo pipefail
          test -n "$APP_SESSION_SECRET"
          if [ "${#APP_SESSION_SECRET}" -lt 32 ]; then
            echo "APP_SESSION_SECRET must be at least 32 characters."
            exit 1
          fi
          test -n "$GOOGLE_IOS_CLIENT_ID"
          test -n "$APPLE_CLIENT_IDS"

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/workout_planner_key
          chmod 600 ~/.ssh/workout_planner_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Transfer files to EC2
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -i ~/.ssh/workout_planner_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            . ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/workout_planner/

      - name: Rebuild and restart Workout Planner
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh -i ~/.ssh/workout_planner_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "APP_SESSION_SECRET='$APP_SESSION_SECRET' \
             ALLOWED_ORIGINS='$ALLOWED_ORIGINS' \
             APP_VERSION='$APP_VERSION' \
             GOOGLE_IOS_CLIENT_ID='$GOOGLE_IOS_CLIENT_ID' \
             APPLE_CLIENT_IDS='$APPLE_CLIENT_IDS' \
             SHORT_SHA='$SHORT_SHA' \
             BUILD_TIME='$BUILD_TIME' \
             bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail
          cd ~/deploy

          read_deploy_env() {
            local key="$1"
            if [ ! -f .env ]; then
              return 0
            fi
            awk -v key="$key" '
              $0 ~ "^[[:space:]]*#" { next }
              index($0, key "=") == 1 {
                value = substr($0, length(key) + 2)
                gsub(/^["\047]|["\047]$/, "", value)
                print value
                exit
              }
            ' .env
          }

          WORKOUT_GOOGLE_CLIENT_ID="${WORKOUT_GOOGLE_CLIENT_ID:-$(read_deploy_env WORKOUT_GOOGLE_CLIENT_ID)}"
          WORKOUT_GOOGLE_CLIENT_IDS="${WORKOUT_GOOGLE_CLIENT_IDS:-$(read_deploy_env WORKOUT_GOOGLE_CLIENT_IDS)}"
          WORKOUT_APPLE_CLIENT_IDS="${WORKOUT_APPLE_CLIENT_IDS:-$(read_deploy_env WORKOUT_APPLE_CLIENT_IDS)}"

          : "${WORKOUT_GOOGLE_CLIENT_ID:?WORKOUT_GOOGLE_CLIENT_ID must be set in ~/deploy/.env}"
          : "${GOOGLE_IOS_CLIENT_ID:?GOOGLE_IOS_CLIENT_ID must be set in GitHub Secrets}"
          : "${APP_SESSION_SECRET:?APP_SESSION_SECRET must be set in GitHub Secrets}"
          : "${APPLE_CLIENT_IDS:?APPLE_CLIENT_IDS must be set}"

          normalize_csv() {
            printf '%s' "${1:-}" | tr -d '[:space:]' | sed 's/^,*//;s/,*$//;s/,,*/,/g'
          }

          append_csv_unique() {
            local list
            local additions
            local value
            list="$(normalize_csv "${1:-}")"
            additions="$(normalize_csv "${2:-}")"
            IFS=',' read -ra values <<< "$additions"
            for value in "${values[@]}"; do
              if [ -z "$value" ]; then
                continue
              fi
              case ",$list," in
                *",$value,"*) ;;
                *) list="${list:+$list,}$value" ;;
              esac
            done
            printf '%s' "$list"
          }

          WORKOUT_GOOGLE_CLIENT_IDS="$(append_csv_unique "$WORKOUT_GOOGLE_CLIENT_IDS" "$WORKOUT_GOOGLE_CLIENT_ID,$GOOGLE_IOS_CLIENT_ID")"
          WORKOUT_APPLE_CLIENT_IDS="$(append_csv_unique "$WORKOUT_APPLE_CLIENT_IDS" "$APPLE_CLIENT_IDS")"
          LOCAL_AUTH_BYPASS=false

          export APP_SESSION_SECRET
          export ALLOWED_ORIGINS
          export APP_VERSION
          export LOCAL_AUTH_BYPASS
          export SHORT_SHA
          export BUILD_TIME
          export WORKOUT_GOOGLE_CLIENT_ID
          export WORKOUT_GOOGLE_CLIENT_IDS
          export WORKOUT_APPLE_CLIENT_IDS

          upsert_deploy_env() {
            local key="$1"
            local value="$2"
            local tmp
            tmp="$(mktemp)"
            if [ -f .env ]; then
              grep -v -E "^${key}=" .env > "$tmp" || true
            fi
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            mv "$tmp" .env
            chmod 600 .env
          }

          upsert_deploy_env WORKOUT_APP_SESSION_SECRET "$APP_SESSION_SECRET"
          upsert_deploy_env WORKOUT_LOCAL_AUTH_BYPASS "$LOCAL_AUTH_BYPASS"
          upsert_deploy_env WORKOUT_ALLOWED_ORIGINS "$ALLOWED_ORIGINS"
          upsert_deploy_env WORKOUT_APP_VERSION "$APP_VERSION"
          upsert_deploy_env WORKOUT_GIT_COMMIT "$SHORT_SHA"
          upsert_deploy_env WORKOUT_BUILD_TIME "$BUILD_TIME"
          upsert_deploy_env WORKOUT_GOOGLE_CLIENT_ID "$WORKOUT_GOOGLE_CLIENT_ID"
          upsert_deploy_env WORKOUT_GOOGLE_CLIENT_IDS "$WORKOUT_GOOGLE_CLIENT_IDS"
          upsert_deploy_env WORKOUT_APPLE_CLIENT_IDS "$WORKOUT_APPLE_CLIENT_IDS"

          cat > docker-compose.override.yml <<'COMPOSE_PERSISTENT_OVERRIDE'
          services:
            workout_api:
              environment:
                NODE_ENV: production
                APP_SESSION_SECRET: ${WORKOUT_APP_SESSION_SECRET}
                ALLOWED_ORIGINS: ${WORKOUT_ALLOWED_ORIGINS}
                LOCAL_AUTH_BYPASS: ${WORKOUT_LOCAL_AUTH_BYPASS:-false}
                APP_VERSION: ${WORKOUT_APP_VERSION:-1.0.0}
                GIT_COMMIT: ${WORKOUT_GIT_COMMIT:-local}
                BUILD_TIME: ${WORKOUT_BUILD_TIME:-local}
                GOOGLE_CLIENT_ID: ${WORKOUT_GOOGLE_CLIENT_ID}
                GOOGLE_CLIENT_IDS: ${WORKOUT_GOOGLE_CLIENT_IDS}
                APPLE_CLIENT_IDS: ${WORKOUT_APPLE_CLIENT_IDS}
          COMPOSE_PERSISTENT_OVERRIDE

          OVERRIDE_FILE="$(mktemp)"
          trap 'rm -f "$OVERRIDE_FILE"' EXIT
          cat > "$OVERRIDE_FILE" <<'COMPOSE_OVERRIDE'
          services:
            workout_api:
              environment:
                NODE_ENV: production
                APP_SESSION_SECRET: ${APP_SESSION_SECRET}
                ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
                LOCAL_AUTH_BYPASS: ${LOCAL_AUTH_BYPASS}
                APP_VERSION: ${APP_VERSION}
                GIT_COMMIT: ${SHORT_SHA}
                BUILD_TIME: ${BUILD_TIME}
                GOOGLE_CLIENT_ID: ${WORKOUT_GOOGLE_CLIENT_ID}
                GOOGLE_CLIENT_IDS: ${WORKOUT_GOOGLE_CLIENT_IDS}
                APPLE_CLIENT_IDS: ${WORKOUT_APPLE_CLIENT_IDS}
          COMPOSE_OVERRIDE

          docker-compose -f docker-compose.yml -f "$OVERRIDE_FILE" build --no-cache \
            --build-arg VITE_DEV_BYPASS_AUTH=false \
            --build-arg VITE_GIT_COMMIT="$SHORT_SHA" \
            --build-arg VITE_APP_VERSION="$APP_VERSION" \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_COMMIT="$SHORT_SHA" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            workout workout_api
          docker-compose -f docker-compose.yml -f "$OVERRIDE_FILE" up -d --force-recreate workout workout_api
          docker-compose -f docker-compose.yml -f "$OVERRIDE_FILE" exec -T workout_api node - <<'NODE'
          const checks = [
            ['APP_SESSION_SECRET', 32],
            ['GOOGLE_CLIENT_IDS', 1],
            ['APPLE_CLIENT_IDS', 1],
          ];
          for (const [key, minLength] of checks) {
            const value = process.env[key] || '';
            if (value.length < minLength) {
              throw new Error(`${key} is not configured in the workout_api container`);
            }
          }
          if (process.env.LOCAL_AUTH_BYPASS !== 'false') {
            throw new Error('LOCAL_AUTH_BYPASS must be false in production');
          }
          console.log('workout_api runtime config verified');
          NODE
          docker system prune -f
          REMOTE_DEPLOY

      - name: Smoke test live app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WEB_BASE_URL/api/healthz"
          curl --fail --silent --show-error "$WEB_BASE_URL/api/version"
          curl --fail --silent --show-error "$WEB_BASE_URL" >/dev/null
