name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy this verified main commit after host preflight approval
        type: boolean
        default: false

concurrency:
  group: repmixburn-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Test web app
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Audit web production dependencies
        run: npm audit --omit=dev

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Audit backend production dependencies
        working-directory: backend
        run: npm audit --omit=dev

      - name: Test isolated deployment command plan
        run: python3 scripts/test-safe-compose-release.py

      - name: Check release hardening config
        run: |
          set -euo pipefail
          grep -q 'FROM node:22' Dockerfile
          grep -q 'StrictHostKeyChecking=yes' .github/workflows/deploy.yml

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || 'https://repmixburn.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY"
          test -n "$EC2_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/workout_planner_key
          chmod 600 ~/.ssh/workout_planner_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Set up Node for production frontend
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build production frontend on runner
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          VITE_API_URL: /api
          VITE_DEV_BYPASS_AUTH: "false"
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ vars.APP_VERSION || '1.2.0' }}
        run: |
          set -euo pipefail
          VITE_GOOGLE_CLIENT_ID="$(ssh -i ~/.ssh/workout_planner_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -o ConnectTimeout=30 "$EC2_USER@$EC2_HOST" 'python3 -' <<'PYTHON'
          import json, subprocess
          ids = subprocess.check_output(['docker', 'ps', '-q', '--filter', 'label=com.docker.compose.service=workout_api'], text=True).split()
          if len(ids) != 1:
              raise SystemExit('Expected exactly one running workout_api')
          item = json.loads(subprocess.check_output(['docker', 'inspect', ids[0]], text=True))[0]
          values = dict(value.split('=', 1) for value in item['Config']['Env'] if '=' in value)
          # OAuth client IDs are public application identifiers, not credentials.
          print(values.get('GOOGLE_CLIENT_ID', ''))
          PYTHON
          )"
          : "${VITE_GOOGLE_CLIENT_ID:?Production Google web client ID is required}"
          export VITE_GOOGLE_CLIENT_ID
          npm ci
          npm run build
          test -s dist/index.html

      - name: Transfer files to EC2
        run: |
          set -euo pipefail
          rsync -avz -e "ssh -i ~/.ssh/workout_planner_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules' \
            . ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/workout_planner/
          # Remove obsolete public bundles from previous releases.
          rsync -az --delete -e "ssh -i ~/.ssh/workout_planner_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            dist/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/workout_planner/dist/

      - name: Rebuild only Workouts with the existing live configuration
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/workout_planner_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "python3 ~/workout_planner/scripts/safe-compose-release.py workouts '$GITHUB_SHA'"

      - name: Smoke test live app
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Container recreation can briefly return 502 before the API is ready.
          # Retry transient HTTP errors and connection refusals, but still fail
          # the deployment when an endpoint does not recover within the budget.
          smoke_curl() {
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-max-time 120 \
              --retry-connrefused --connect-timeout 5 --max-time 10 "$1"
          }
          smoke_curl "$WEB_BASE_URL/api/healthz"
          smoke_curl "$WEB_BASE_URL/api/version"
          smoke_curl "$WEB_BASE_URL" >/dev/null
