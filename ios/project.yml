name: WorkoutPlanner
options:
  bundleIdPrefix: com.workoutplanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  WorkoutPlanner:
    type: application
    platform: iOS
    sources:
      - WorkoutPlanner
      - Shared
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: WorkoutPlannerLiveActivity
        embed: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.workoutplanner.ios
        PRODUCT_NAME: Rep, Mix, Burn
        MARKETING_VERSION: 1.2
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: WorkoutPlanner/WorkoutPlanner.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(IOS_PROFILE_NAME)"
    info:
      path: WorkoutPlanner/Info.plist
      properties:
        CFBundleDisplayName: Rep Mix Burn
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        API_BASE_URL: "https://repmixburn.com/api"
        GOOGLE_IOS_CLIENT_ID: "YOUR_IOS_CLIENT_ID.apps.googleusercontent.com"
        GIT_COMMIT_HASH: "local"
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.workoutplanner.ios.pending-sync
        UIBackgroundModes:
          - fetch
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "com.googleusercontent.apps.YOUR_IOS_CLIENT_ID"
          - CFBundleURLName: Rep, Mix, Burn companion
            CFBundleURLSchemes:
              - repmixburn
              # Compatibility for existing companion app installations.
              - forgeworkout
  WorkoutPlannerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - WorkoutPlannerLiveActivity
      - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.workoutplanner.ios.LiveActivity
        PRODUCT_NAME: RepMixBurnLiveActivity
        MARKETING_VERSION: 1.2
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: WorkoutPlannerLiveActivity/WorkoutPlannerLiveActivity.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(IOS_LIVE_ACTIVITY_PROFILE_NAME)"
    info:
      path: WorkoutPlannerLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Rep, Mix, Burn
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
