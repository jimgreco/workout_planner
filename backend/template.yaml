AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Workout Planner — serverless API (API Gateway + Lambda + DynamoDB)

Parameters:
  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 Client ID used for ID token verification

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref WorkoutTable
        GOOGLE_CLIENT_ID: !Ref GoogleClientId

Resources:

  # ── DynamoDB single-table ───────────────────────────────────────────────────
  # PK = USER#<googleSub>
  # SK = EXERCISE#<uuid> | TEMPLATE#<uuid> | LOG#<uuid>
  # BillingMode = PAY_PER_REQUEST — zero cost at rest, scales automatically
  # DeletionPolicy = Retain — never destroy workout data if the stack is deleted
  WorkoutTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ── HTTP API ────────────────────────────────────────────────────────────────
  # CORS is handled at the API Gateway level so that error responses (401, 500)
  # still include the right headers — Lambda does not set them.
  WorkoutApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:5173"
          - "https://*.cloudfront.net"
        AllowHeaders:
          - "Authorization"
          - "Content-Type"
        AllowMethods:
          - "GET"
          - "PUT"
          - "DELETE"

  # ── Lambda function ─────────────────────────────────────────────────────────
  WorkoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handler.handler
      CodeUri: .
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref WorkoutTable
      Events:
        # Single catch-all route — handler dispatches by path + method
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkoutApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${WorkoutApi}.execute-api.${AWS::Region}.amazonaws.com"
